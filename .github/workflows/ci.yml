name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Tests run against SQLite and mocked transports, so no services and
        # no secrets are needed.
        run: python -m pytest -q

      - name: Check migrations match the models
        # Autogenerating against an up-to-date database must produce an empty
        # migration. If this fails, someone changed a model without adding a
        # revision — exactly the drift that bites on the next deploy.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic revision --autogenerate -m "ci drift check" >/dev/null
          latest=$(ls -t migrations/versions/*.py | head -1)
          if grep -qE "^\s+op\.(create|drop|alter|add)_" "$latest"; then
            echo "::error::Models have drifted from migrations. Generated revision:"
            cat "$latest"
            exit 1
          fi
          rm -f "$latest"
          echo "Schema matches migrations."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
